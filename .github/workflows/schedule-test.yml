name: Testa GitHub-schemaläggning

on:
  schedule:
    # Var femte minut, men undviker hel timme.
    - cron: '2/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Visa startorsak och tid
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Schedule: ${SCHEDULE:-manual}"
          echo "UTC: $(date -u --iso-8601=seconds)"
